name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync.py selftest
      - run: python -m py_compile sync.py
      - name: Reject unknown commands
        run: |
          if python sync.py typo; then
            exit 1
          fi
      - run: sh -n setup.sh
      - run: plutil -lint com.local.withings-garmin-sync.plist.example
